<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | AUTN TANIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/variables.css?v=4">
    <link rel="stylesheet" href="../../css/base.css?v=4">
    <link rel="stylesheet" href="../../css/components.css?v=4">
    <link rel="stylesheet" href="../../css/layout.css?v=4">
    <link rel="stylesheet" href="../../css/auth.css?v=4">
</head>
<body>
    <main class="auth-layout">
        <section class="auth-card" aria-label="Iniciar sesión">
            <header class="auth-header">
                <img src="../../assets/icons/logo.svg" alt="Logo AUTN TANIA" class="auth-logo">
                <h1 class="auth-title">SISTEMA DE GESTION<span class="auth-title-line">O&amp;M</span></h1>
                <p class="auth-subtitle">Iniciar sesión</p>
            </header>

            <form id="login-form" novalidate>
                <div id="login-alert" class="alert" role="alert" hidden></div>

                <div class="form-group">
                    <label for="rol" class="form-label">Tipo de perfil</label>
                    <div class="rol-toggle-wrap">
                        <div class="toggle-cont" id="rol-toggle-cont">
                            <input type="checkbox" class="toggle-input" id="rol" name="rol">
                            <label class="toggle-label" for="rol" aria-label="Cambiar tipo de perfil">
                                <span class="cont-icon">
                                    <span class="sparkle" style="--deg: 75; --duration: 35" aria-hidden="true"></span>
                                    <span class="sparkle" style="--deg: 165; --duration: 28" aria-hidden="true"></span>
                                    <span class="sparkle" style="--deg: 255; --duration: 42" aria-hidden="true"></span>
                                    <span class="sparkle" style="--deg: 345; --duration: 48" aria-hidden="true"></span>
                                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
                                    </svg>
                                </span>
                            </label>
                        </div>
                        <div class="rol-toggle-text">
                            <span class="rol-status" id="rol-status">Usuario Móvil</span>
                            <span class="rol-status-sub">Cambie de rol para iniciar como Administrador</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cedula" class="form-label">Número de cédula</label>
                    <div class="input-icon">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="cedula" name="cedula" class="form-input"
                               placeholder="Ingresa tu número de cédula" autocomplete="off"
                               inputmode="numeric" maxlength="15" required>
                    </div>
                    <p id="cedula-error" class="form-error" hidden></p>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-icon">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" class="form-input"
                               placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                    </div>
                    <p id="password-error" class="form-error" hidden></p>
                    <div class="forgot-row">
                        <button type="button" class="forgot-btn" id="forgot-password-btn">
                            <span>¿Olvidó su contraseña?</span>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-block">Iniciar sesión</button>
            </form>
        </section>
    </main>

    <div class="bugs-easter" id="bugs-easter">
        <div class="bugs-viewer" id="bugs-viewer" hidden>
            <img src="../../assets/images/bugs-bunny.gif" alt="Bugs Bunny" class="bugs-gif">
        </div>
        <button type="button" class="bugs-toggle" id="bugs-toggle" aria-label="Mostrar Bugs Bunny">
            <span class="bugs-dot"></span>
        </button>
    </div>

    <div class="modal-backdrop" id="forgot-modal" role="dialog" aria-modal="true"
         aria-labelledby="forgot-modal-title" hidden>
        <div class="modal">
            <button type="button" class="modal-close" id="forgot-modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
            <span class="modal-icon modal-icon-info" aria-hidden="true">!</span>
            <h2 class="modal-title" id="forgot-modal-title">Su clave es la misma que su número de cédula</h2>
            <p class="modal-text">Ingrese su número de cédula en los campos de cédula y contraseña.</p>
            <button type="button" class="btn btn-primary btn-block" id="forgot-modal-accept">Entendido</button>
        </div>
    </div>

    <script src="../../js/app.js?v=4"></script>
    <script src="../../js/auth.js?v=4"></script>
</body>
</html>
