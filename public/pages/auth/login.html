<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | AUTN TANIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/variables.css?v=3">
    <link rel="stylesheet" href="../../css/base.css?v=3">
    <link rel="stylesheet" href="../../css/components.css?v=3">
    <link rel="stylesheet" href="../../css/layout.css?v=3">
    <link rel="stylesheet" href="../../css/auth.css?v=3">
</head>
<body>
    <main class="auth-layout">
        <section class="auth-card" aria-label="Iniciar sesión">
            <header class="auth-header">
                <img src="../../assets/icons/logo.svg" alt="Logo AUTN TANIA" class="auth-logo">
                <h1 class="auth-title">SISTEMA DE GESTION</h1>
                <p class="auth-subtitle">Iniciar sesión</p>
            </header>

            <form id="login-form" novalidate>
                <div id="login-alert" class="alert" role="alert" hidden></div>

                <div class="form-group">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <div class="input-icon">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="M22 7l-10 5L2 7"></path>
                        </svg>
                        <input type="email" id="correo" name="correo" class=" form-input"
                               placeholder="correo@ejemplo.com" autocomplete="email" required>
                    </div>
                    <p id="correo-error" class="form-error" hidden></p>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-icon">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" class="form-input"
                               placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                    </div>
                    <p id="password-error" class="form-error" hidden></p>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-block">Iniciar sesión</button>
            </form>
        </section>
    </main>

    <script src="../../js/app.js?v=3"></script>
    <script src="../../js/auth.js?v=3"></script>
</body>
</html>
