<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | AUTN TANIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/variables.css?v=4">
    <link rel="stylesheet" href="../css/base.css?v=4">
    <link rel="stylesheet" href="../css/components.css?v=4">
    <link rel="stylesheet" href="../css/layout.css?v=4">
    <link rel="stylesheet" href="../css/historial.css?v=4">
</head>
<body class="app-body">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="sidebar-brand">
            <span class="brand-kicker">Menú</span>
            <img src="../assets/icons/logo.svg" alt="Logo de la aplicación" class="sidebar-logo">
            <button type="button" class="btn-sidebar-close" id="btn-sidebar-close" aria-label="Cerrar menú">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav"></nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <span class="avatar" id="user-avatar" aria-hidden="true"></span>
                <div>
                    <p class="user-name" id="user-name">Cargando...</p>
                    <p class="user-rol" id="user-rol"></p>
                </div>
            </div>
            <button type="button" id="logout-btn" class="btn-logout">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Cerrar sesión
            </button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
        <header class="topbar">
            <button type="button" class="btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Abrir menú">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div>
                <h1 class="page-title">Historial</h1>
                <p class="page-subtitle">Resumen de todas las órdenes procesadas</p>
            </div>
        </header>

        <main class="content">
            <div id="historial-alert" class="alert" role="alert" hidden></div>

            <section class="page-card">
                <header class="page-card-header">
                    <h2 class="page-card-title">Órdenes registradas</h2>
                    <p class="page-card-subtitle">Cada PDF procesado genera una orden. Haz clic en "Ver" para consultar la orden completa.</p>
                </header>
                <div class="card-body">
                    <div class="table-wrapper">
                        <table class="data-table" id="historial-table">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Archivo</th>
                                    <th>Municipio</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="historial-body"></tbody>
                        </table>
                    </div>
                    <p class="empty-text table-empty" id="historial-vacio" hidden>
                        No hay órdenes registradas aún.
                    </p>
                </div>
            </section>

            <div class="form-actions">
                <a href="../dashboard/dashboard.html" class="btn btn-primary btn-block">
                    Procesar nuevo PDF
                </a>
            </div>
        </main>
    </div>

    <script src="../js/app.js?v=4"></script>
    <script src="../js/historial.js?v=4"></script>
</body>
</html>
