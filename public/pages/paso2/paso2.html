<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso 2 | AUTN TANIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/paso2.css">
</head>
<body class="app-body">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="sidebar-brand">
            <span class="brand-kicker">Menú</span>
            <img src="../../assets/icons/logo.svg" alt="Logo de la aplicación" class="sidebar-logo">
            <button type="button" class="btn-sidebar-close" id="btn-sidebar-close" aria-label="Cerrar menú">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <p class="nav-section">Principal</p>
            <a href="../dashboard/dashboard.html" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                Dashboard
            </a>
            <a href="../historial/historial.html" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                Historial
            </a>

            <p class="nav-section">Administración</p>
            <a href="../administracion/usuarios.html" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                Usuarios
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <span class="avatar" id="user-avatar" aria-hidden="true"></span>
                <div>
                    <p class="user-name" id="user-name">Cargando...</p>
                    <p class="user-rol" id="user-rol"></p>
                </div>
            </div>
            <button type="button" id="logout-btn" class="btn-logout">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Cerrar sesión
            </button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
        <header class="topbar">
            <button type="button" class="btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Abrir menú">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div>
                <h1 class="page-title">Paso 2</h1>
                <p class="page-subtitle">Registro de información del técnico</p>
            </div>
        </header>

        <main class="content">
            <section class="page-card">
                <header class="page-card-header">
                    <h2 class="page-card-title">Datos del proceso</h2>
                    <p class="page-card-subtitle">Llena los datos solicitados para completar el proceso.</p>
                </header>

                <form id="paso2-form" novalidate>
                    <div id="paso2-alert" class="alert" role="alert" hidden></div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="supervisor" class="form-label">Supervisor</label>
                            <input type="text" id="supervisor" class="form-input" placeholder="Nombre del supervisor">
                            <p id="supervisor-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group">
                            <label for="wo" class="form-label">WO Vulnerabilidad</label>
                            <input type="text" id="wo" class="form-input" placeholder="N° de orden de trabajo">
                            <p id="wo-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group">
                            <label for="tecnico" class="form-label">Técnico Móvil</label>
                            <input type="text" id="tecnico" class="form-input" placeholder="Nombre del técnico móvil">
                            <p id="tecnico-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group">
                            <label for="estado" class="form-label">Estado V</label>
                            <select id="estado" class="form-select">
                                <option value="" selected disabled>Selecciona...</option>
                                <option value="Pendiente">Pendiente</option>
                                <option value="En proceso">En proceso</option>
                                <option value="Finalizada">Finalizada</option>
                                <option value="Verificada">Verificada</option>
                            </select>
                            <p id="estado-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group field-full">
                            <label for="link-rf" class="form-label">Link RF Finalizado Vulnerabilidad</label>
                            <input type="text" id="link-rf" class="form-input" placeholder="https://...">
                            <p id="link-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group field-full">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea id="observaciones" class="form-input form-textarea" placeholder="Notas adicionales"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="paso2-btn" class="btn btn-primary btn-block">Guardar</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="../../js/app.js"></script>
    <script src="../../js/paso2.js"></script>
</body>
</html>
