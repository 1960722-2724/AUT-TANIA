<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso 2 | AUTN TANIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../css/variables.css?v=6">
    <link rel="stylesheet" href="../../../css/base.css?v=6">
    <link rel="stylesheet" href="../../../css/components.css?v=6">
    <link rel="stylesheet" href="../../../css/layout.css?v=6">
    <link rel="stylesheet" href="../../../css/paso2.css?v=6">
</head>
<body class="app-body">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="sidebar-brand">
            <span class="brand-kicker">Menú</span>
            <img src="../../../assets/icons/logo.svg" alt="Logo de la aplicación" class="sidebar-logo">
            <button type="button" class="btn-sidebar-close" id="btn-sidebar-close" aria-label="Cerrar menú">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav"></nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <span class="avatar" id="user-avatar" aria-hidden="true"></span>
                <div>
                    <p class="user-name" id="user-name">Cargando...</p>
                    <p class="user-rol" id="user-rol"></p>
                </div>
            </div>
            <button type="button" id="logout-btn" class="btn-logout">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Cerrar sesión
            </button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
        <header class="topbar">
            <button type="button" class="btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Abrir menú">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div>
                <h1 class="page-title">Paso 2</h1>
                <p class="page-subtitle">Registro de información del técnico</p>
            </div>
        </header>

        <main class="content">
            <section class="page-card">
                <header class="page-card-header">
                    <h2 class="page-card-title">Datos del proceso</h2>
                    <p class="page-card-subtitle">Llena los datos solicitados para completar el proceso.</p>
                </header>

                <form id="paso2-form" novalidate>
                    <div id="paso2-alert" class="alert" role="alert" hidden></div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="supervisor" class="form-label">Supervisor</label>
                            <input type="text" id="supervisor" class="form-input" placeholder="Nombre del supervisor">
                            <p id="supervisor-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group">
                            <label for="wo" class="form-label">WO Vulnerabilidad</label>
                            <input type="text" id="wo" class="form-input" placeholder="N° de orden de trabajo">
                            <p id="wo-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group">
                            <label for="tecnico" class="form-label">Técnico Móvil</label>
                            <input type="text" id="tecnico" class="form-input" placeholder="Nombre del técnico móvil">
                            <p id="tecnico-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group">
                            <label for="estado" class="form-label">Estado V</label>
                            <select id="estado" class="form-select">
                                <option value="" selected disabled>Selecciona...</option>
                                <option value="Pendiente">Pendiente</option>
                                <option value="En proceso">En proceso</option>
                                <option value="Finalizada">Finalizada</option>
                                <option value="Verificada">Verificada</option>
                            </select>
                            <p id="estado-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group field-full">
                            <label class="form-label">Evidencia fotográfica *</label>
                            <div class="photo-upload" id="photo-upload">
                                <div class="photo-upload-empty" id="photo-empty">
                                    <div class="photo-upload-area">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                            <circle cx="12" cy="13" r="4"></circle>
                                        </svg>
                                        <p>Agrega una foto de evidencia</p>
                                    </div>
                                    <div class="photo-actions">
                                        <button type="button" class="btn btn-secondary" id="btn-tomar-foto">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                                <circle cx="12" cy="13" r="4"></circle>
                                            </svg>
                                            Tomar foto
                                        </button>
                                        <button type="button" class="btn btn-secondary" id="btn-subir-foto">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                                <polyline points="17 8 12 3 7 8"></polyline>
                                                <line x1="12" y1="3" x2="12" y2="15"></line>
                                            </svg>
                                            Subir foto
                                        </button>
                                    </div>
                                </div>
                                <div class="photo-preview" id="photo-preview" hidden>
                                    <img id="photo-preview-img" src="" alt="Vista previa de la evidencia">
                                    <button type="button" class="photo-remove" id="btn-eliminar-foto" aria-label="Eliminar foto">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <input type="file" id="input-camera" accept="image/*" capture="environment" hidden>
                            <input type="file" id="input-file" accept="image/*" hidden>
                            <p id="foto-error" class="form-error" hidden></p>
                        </div>

                        <div class="form-group field-full">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea id="observaciones" class="form-input form-textarea" placeholder="Notas adicionales"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="../hallazgo/hallazgo.html" class="link paso2-volver">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                            Regresar al hallazgo
                        </a>
                        <button type="submit" id="paso2-btn" class="cta cta-center">
                            <span class="span">Guardar</span>
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="../../../js/app.js?v=7"></script>
    <script src="../../../js/paso2.js?v=7"></script>
</body>
</html>
